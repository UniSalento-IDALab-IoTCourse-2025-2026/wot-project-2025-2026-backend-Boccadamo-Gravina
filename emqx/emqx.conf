## Place read-only configurations in this file.
## To define configurations that can later be overridden through UI/API/CLI, add them to `etc/base.hocon`.
##
## Config precedence order:
##   etc/base.hocon < cluster.hocon < emqx.conf < environment variables
##
## See https://www.emqx.io/docs/en/latest/configuration/configuration.html for more information.
## Configuration full example can be found in etc/examples

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
    listeners {
        http.bind = 18083
        # https.bind = 18084
        https {
            ssl_options {
                certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
                keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
            }
        }
    }
}

authentication = [
  {
    mechanism = "password_based"
    backend = "built_in_database"
    enable = true
    bootstrap_file = "/opt/emqx/etc/auth-built-in-db-bootstrap.csv"

    # EMQX leggerà automaticamente le variabili d'ambiente sostituendole all'avvio
    # bootstrap_users = [
    #   {
    #     username = "${MQTT_EDGE_DEVICE_USER}"
    #     password = "${MQTT_EDGE_DEVICE_PASS}"
    #   },
    #   {
    #     username = "${MQTT_BACKEND_SERVICE_USER}"
    #     password = "${MQTT_BACKEND_SERVICE_PASS}"
    #   },
    #   {
    #     username = "${MQTT_SU_USER}"
    #     password = "${MQTT_SU_PASS}"
    #   }
    # ]
  }
]

authorization {
  no_match = "deny"
  deny_action = "ignore"

  sources = [
    {
      type = "file"
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
