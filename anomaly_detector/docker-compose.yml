services:

  anomaly-detector:
    build: .
    container_name: anomaly_detector
    environment:
      - MQTT_BROKER=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_BACKEND_SERVICE_USER}
      - MQTT_PASSWORD=${MQTT_BACKEND_SERVICE_PASS}
      - MQTT_TOPIC_INPUT=telemetry/air_quality
      - MQTT_TOPIC_ANOMALY=telemetry/anomalies
      - EWMA_ALPHA=0.1
      - WARMUP_SAMPLES=15
      - Z_THRESHOLD=2.5
      - STATE_FILE_PATH=/app/data/state.json
    volumes:
      - anomaly_data:/app/data
    networks:
      - iot-network
    restart: on-failure

networks:
  iot-network:
    external: true

volumes:
  anomaly_data:
